name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/root/torball/torball.it"
            BRANCH="dev"

            cd "$APP_DIR"

            echo "[+] Saving current commit"
            OLD_COMMIT=$(git rev-parse HEAD)
            echo "$OLD_COMMIT" > .last_good_commit

            echo "[+] Updating repository"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "[+] Building containers"
            docker compose up -d --build

            echo "[+] Waiting for startup"
            sleep 20

            echo "[+] Container status"
            docker compose ps

            echo "[+] API healthcheck"
            curl -fsS http://localhost:8082/api/health

            echo "[+] Frontend healthcheck"
            curl -fsS http://localhost:8080 > /dev/null

            echo "[+] Deployment successful"

      - name: Rollback if deployment fails
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/root/torball/torball.it"

            cd "$APP_DIR"

            if [ -f .last_good_commit ]; then
              OLD_COMMIT=$(cat .last_good_commit)

              echo "[!] Rolling back to $OLD_COMMIT"

              git reset --hard "$OLD_COMMIT"

              docker compose up -d --build

              sleep 20

              curl -fsS http://localhost:8082/api/health
              curl -fsS http://localhost:8080 > /dev/null

              echo "[+] Rollback successful"
            else
              echo "[!] No rollback point found"
              exit 1
            fi
